[tool.poetry]
name = "tcc-api"
version = "0.1.0"
description = "Judge API"
authors = ["Caio Santoro <csantbr@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12"
blue = ">=0.9.1"
fastapi = ">=0.115.6"
hypercorn = ">=0.17.3"
mongodb-migrations = "1.3.0"
motor = "3.4.0"
psycopg2-binary = ">=2.9.10"
pydantic-settings = ">=2.7.0"
pymongo = "4.6.3"
python-dotenv = ">=1.0.1"
kafka-python = ">=2.0.2"
confluent-kafka = ">=2.3.0"
aio-pika = "9.3.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
