[tool.poetry]
name = "judge"
version = "0.1.0"
description = "Judge API"
authors = ["Caio Santoro <csantbr@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12"
blue = ">=0.9.1"
fastapi = ">=0.115.6"
hypercorn = ">=0.17.3"
mongodb-migrations = "1.3.0"
motor = "3.4.0"
pydantic-settings = ">=2.7.0"
pymongo = "4.6.3"
python-dotenv = ">=1.0.1"
redis = ">=5.0.1"
rq = ">=1.15.1"

[tool.setuptools]
packages = ["judge", "migrations"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
