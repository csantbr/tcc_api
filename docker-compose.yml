services:
  mongodb:
    hostname: mongodb
    container_name: mongodb
    image: mongo:5
    expose:
      - 27017
    ports:
      - 27017:27017
    restart: always
    healthcheck:
      test: test $$(echo "rs.initiate({_id:\"rs0\",version:1,members:[{_id:0,host:\"mongodb:27017\"}]}).ok || rs.slaveOk().ok || rs.status().ok" | mongo --quiet)
      interval: 10s
      start_period: 30s
    entrypoint: [ "/usr/bin/mongod", "--bind_ip_all", "--replSet", "rs0" ]

  judge:
    build:
      context: .
      dockerfile: Dockerfile.judge
    container_name: judge
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/judge?replicaSet=rs0
      - MONGODB_DATABASE=judge
      - TLE_TIMEOUT=30
      - MEMORY_LIMIT=512
    ports:
      - "8000:8000"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
